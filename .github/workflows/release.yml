name: CI & Portable Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-verify:
    name: Build, Verify & Package Hyperion (win-x64)
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'ga'

      - name: Restore dependencies
        run: dotnet restore Hyperion.sln

      - name: Build solution & contract tests
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF.Substring(11) } else { '0.0.3' }
          dotnet build Hyperion.sln -c Release -v minimal --no-restore /p:Version=$ver

      - name: Execute contract, isolation, ConPTY & E2E simulation tests
        shell: pwsh
        env:
          CI: 'true'
        run: |
          dotnet tests/CodexMultiLauncher.ContractTests/bin/Release/net10.0-windows/CodexMultiLauncher.ContractTests.dll

      - name: Publish single-file portable executable (stripped PDB)
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF.Substring(11) } else { '0.0.3' }
          $outDir = "publish/Hyperion-win-x64"
          dotnet publish src/CodexMultiLauncher/CodexMultiLauncher.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            /p:Version=$ver `
            /p:PublishSingleFile=true `
            /p:EnableCompressionInSingleFile=true `
            /p:DebugType=None `
            /p:DebugSymbols=false `
            -o $outDir

          Remove-Item "$outDir/*.pdb" -Force -ErrorAction SilentlyContinue
          if (Test-Path "$outDir/CodexMultiLauncher.exe") {
            Move-Item "$outDir/CodexMultiLauncher.exe" "$outDir/Hyperion.exe" -Force
          }
          Copy-Item LICENSE "$outDir/LICENSE.txt" -Force
          Copy-Item README.md "$outDir/README.md" -Force

          New-Item -ItemType Directory -Force -Path "release-assets" | Out-Null
          Compress-Archive -Path "$outDir/*" -DestinationPath "release-assets/Hyperion-portable-win-x64.zip" -Force

          $hash = (Get-FileHash "release-assets/Hyperion-portable-win-x64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Hyperion-portable-win-x64.zip" | Set-Content -Path "release-assets/SHA256SUMS.txt" -Encoding utf8

      - name: Upload CI build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hyperion-portable-win-x64
          path: release-assets/*

      - name: Publish GitHub Release (on tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/Hyperion-portable-win-x64.zip
            release-assets/SHA256SUMS.txt
